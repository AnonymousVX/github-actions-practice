#goal for workflow: make linter check the syntax of code

name: auto-linter
on:
  push:
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    # this step will auto clone code of current branch into runner
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v7

      # this step will install the linting tool
      - name: Install Python Linter
        run: pip install ruff
