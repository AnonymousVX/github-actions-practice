#goal for workflow: make linter check the syntax of code

name: auto-linter
on:
  push:
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    
    steps:
    
      # this step will auto clone code of current branch into runner
      - name: Checkout/Clone the code
        uses: actions/checkout@v7
        
      # this step will install python
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # this step will install the linting tool
      - name: Install Python Linter
        run: pip install ruff

      # this step will run code and check for linting
      - name: Check the files for linting
        run: ruff check .
